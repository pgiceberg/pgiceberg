name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: Build and test (PostgreSQL ${{ matrix.pg-version }}, ${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        pg-version:
          - "16.14"
          - "17.10"
          - "18.4"
        os:
          - ubuntu-24.04
          - macos-26
    env:
      PG_VERSION: ${{ matrix.pg-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install CI dependencies
        run: .github/scripts/install-ci-dependencies.sh

      - name: Restore pgenv PostgreSQL cache
        id: cache-pgenv
        uses: actions/cache/restore@v4
        with:
          path: ~/.pgenv
          key: pgenv-${{ runner.os }}-${{ matrix.pg-version }}-${{ github.run_id }}-v1
          restore-keys: |
            pgenv-${{ runner.os }}-${{ matrix.pg-version }}-

      - name: Restore CMake build dependencies cache
        id: cache-cmake-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            build/tests/_deps
          key: cmake-deps-tests-${{ runner.os }}-pg${{ matrix.pg-version }}-${{ hashFiles('cmake_modules/DependencyToolchain.cmake') }}-${{ github.run_id }}-v1
          restore-keys: |
            cmake-deps-tests-${{ runner.os }}-pg${{ matrix.pg-version }}-${{ hashFiles('cmake_modules/DependencyToolchain.cmake') }}-
            cmake-deps-tests-${{ runner.os }}-pg${{ matrix.pg-version }}-
            cmake-deps-tests-${{ runner.os }}-

      - name: Write dependency cache summary
        if: always()
        env:
          CACHE_CONTEXT: ${{ matrix.os }} / PostgreSQL ${{ matrix.pg-version }}
          PGENV_CACHE_HIT: ${{ steps.cache-pgenv.outputs.cache-hit }}
          CMAKE_DEPS_CACHE_HIT: ${{ steps.cache-cmake-deps.outputs.cache-hit }}
        run: bash .github/scripts/write-cache-summary.sh

      - name: Install PostgreSQL with pgenv
        run: .github/scripts/install-pgenv.sh "${PG_VERSION}"

      - name: Configure
        run: |
          export PATH="${HOME}/.pgenv/bin:${HOME}/.pgenv/pgsql/bin:${PATH}"
          cmake -S . -B build/tests -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPG_CONFIG="$(command -v pg_config)"

      - name: Build
        run: cmake --build build/tests

      - name: Write ccache summary
        if: always()
        run: |
          {
            echo "### ccache statistics"
            echo
            echo '```'
            ccache -s || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install extension
        run: cmake --install build/tests --component pgiceberg

      - name: Run regression tests
        run: ctest --test-dir build/tests --output-on-failure

      - name: Show regression artifacts
        if: failure()
        run: |
          for file in \
            build/tests/test/pg_regress.conf \
            build/tests/test/extension/pgiceberg.control \
            build/tests/test/regress/regression.diffs \
            build/tests/test/regress/regression.out \
            build/tests/test/regress/log/initdb.log \
            build/tests/test/regress/log/postmaster.log \
            build/tests/Testing/Temporary/LastTest.log; do
            if [[ -f "${file}" ]]; then
              echo "::group::${file}"
              cat "${file}"
              echo "::endgroup::"
            fi
          done

      - name: Upload regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-pg${{ matrix.pg-version }}-${{ matrix.os }}
          path: |
            build/tests/test/pg_regress.conf
            build/tests/test/extension
            build/tests/test/regress/regression.diffs
            build/tests/test/regress/regression.out
            build/tests/test/regress/log
            build/tests/test/regress/results
            build/tests/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save CMake build dependencies cache
        if: always() && steps.cache-cmake-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            build/tests/_deps
          key: cmake-deps-tests-${{ runner.os }}-pg${{ matrix.pg-version }}-${{ hashFiles('cmake_modules/DependencyToolchain.cmake') }}-${{ github.run_id }}-v1

      - name: Save pgenv PostgreSQL cache
        if: always() && steps.cache-pgenv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.pgenv
          key: pgenv-${{ runner.os }}-${{ matrix.pg-version }}-${{ github.run_id }}-v1

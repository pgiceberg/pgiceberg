name: Sanitizers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_VERSION: "18.4"
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  sanitizers:
    name: ASAN and UBSAN
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install CI dependencies
        run: .github/scripts/install-ci-dependencies.sh

      - name: Restore pgenv PostgreSQL cache
        id: cache-pgenv
        uses: actions/cache/restore@v4
        with:
          path: ~/.pgenv
          key: pgenv-${{ runner.os }}-${{ env.PG_VERSION }}-${{ github.run_id }}-v1
          restore-keys: |
            pgenv-${{ runner.os }}-${{ env.PG_VERSION }}-

      - name: Restore CMake build dependencies cache
        id: cache-cmake-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            build/sanitizers/_deps
          key: cmake-deps-sanitizers-${{ runner.os }}-${{ hashFiles('cmake_modules/DependencyToolchain.cmake') }}-${{ github.run_id }}-v1
          restore-keys: |
            cmake-deps-sanitizers-${{ runner.os }}-${{ hashFiles('cmake_modules/DependencyToolchain.cmake') }}-
            cmake-deps-sanitizers-${{ runner.os }}-

      - name: Write dependency cache summary
        if: always()
        env:
          CACHE_CONTEXT: ${{ runner.os }} / PostgreSQL ${{ env.PG_VERSION }}
          PGENV_CACHE_HIT: ${{ steps.cache-pgenv.outputs.cache-hit }}
          CMAKE_DEPS_CACHE_HIT: ${{ steps.cache-cmake-deps.outputs.cache-hit }}
        run: bash .github/scripts/write-cache-summary.sh

      - name: Install PostgreSQL with pgenv
        run: .github/scripts/install-pgenv.sh "${PG_VERSION}"

      - name: Configure sanitizer build
        run: |
          export PATH="${HOME}/.pgenv/bin:${HOME}/.pgenv/pgsql/bin:${PATH}"
          cmake -S . -B build/sanitizers -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPG_CONFIG="$(command -v pg_config)" \
            -DPGICEBERG_SANITIZERS=address,undefined

      - name: Build sanitizer target
        run: cmake --build build/sanitizers

      - name: Write ccache summary
        if: always()
        run: |
          {
            echo "### ccache statistics"
            echo
            echo '```'
            ccache -s || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install sanitizer extension
        run: cmake --install build/sanitizers --component pgiceberg

      - name: Run sanitizer regression tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          ctest --test-dir build/sanitizers --output-on-failure

      - name: Save CMake build dependencies cache
        if: always() && steps.cache-cmake-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            build/sanitizers/_deps
          key: cmake-deps-sanitizers-${{ runner.os }}-${{ hashFiles('cmake_modules/DependencyToolchain.cmake') }}-${{ github.run_id }}-v1

      - name: Save pgenv PostgreSQL cache
        if: always() && steps.cache-pgenv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.pgenv
          key: pgenv-${{ runner.os }}-${{ env.PG_VERSION }}-${{ github.run_id }}-v1
